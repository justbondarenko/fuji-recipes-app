name: Build

# A debug APK per push, downloadable from the run's Artifacts.
# Also runs the unit tests, so a build that produces an APK is one whose tests passed.
# Push only: a pull_request trigger on top of it would run the same commit twice, and a
# push run on a branch already shows up in that branch's pull request checks.
on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # JDK 17: what `app/build.gradle.kts` compiles against.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Accepts the SDK licences, so AGP can fetch the platform compileSdk asks for.
      - uses: android-actions/setup-android@v3

      - run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 14

      # Every build produces `app-debug.apk`, so a Downloads folder with three of them tells
      # you nothing. Stamped with the build time (UTC), the run number and the commit, the
      # file says which build it is without opening it — and the artifact carries the run
      # number too, because the zip is what actually lands on disk.
      - name: Name the APK
        run: |
          set -euo pipefail
          stamp=$(date -u +%Y%m%d-%H%M)
          name="fuji-recipes-debug-${stamp}-r${{ github.run_number }}-${GITHUB_SHA::7}.apk"
          mkdir -p build/apk
          cp app/build/outputs/apk/debug/app-debug.apk "build/apk/${name}"
          echo "Built ${name} — run id ${{ github.run_id }}"

      - name: Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fuji-recipes-debug-apk-r${{ github.run_number }}
          path: build/apk/*.apk
          retention-days: 14
          if-no-files-found: error
