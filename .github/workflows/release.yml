name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Setup Release Keystore
        id: keystore_setup
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore..."
            mkdir -p /tmp/keystore
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > /tmp/keystore/release.keystore
            echo "has_keystore=true" >> $GITHUB_OUTPUT
            echo "RELEASE_KEYSTORE_PATH=/tmp/keystore/release.keystore" >> $GITHUB_ENV
          else
            echo "No RELEASE_KEYSTORE_BASE64 secret provided. Falling back to debug key signing."
            echo "has_keystore=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Release APK and AAB
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease

      - name: Prepare Release Artifacts
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag_name }}" ]; then
            tag="${{ inputs.tag_name }}"
          fi
          
          mkdir -p dist
          # Copy APK
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/fuji-recipes-${tag}.apk"
          fi
          # Copy AAB
          if [ -f app/build/outputs/bundle/release/app-release.aab ]; then
            cp app/build/outputs/bundle/release/app-release.aab "dist/fuji-recipes-${tag}.aab"
          fi
          
          echo "Prepared artifacts in dist/:"
          ls -lh dist/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/*
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
