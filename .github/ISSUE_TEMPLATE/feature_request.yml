name: ✨ Feature Request
description: Suggest an idea, enhancement, or new feature for Fuji Recipes.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make Fuji Recipes better? We'd love to hear it!

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      placeholder: A clear and concise description of what the problem is. Ex. I'm always frustrated when...
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      placeholder: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Additional context or alternatives considered
      placeholder: Any other context, mockups, or alternative solutions you've considered.
    validations:
      required: false
